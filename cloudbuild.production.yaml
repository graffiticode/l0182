# Cloud Build configuration for production deployments (main branch)
steps:
  # Install dependencies
  - name: 'node'
    entrypoint: 'npm'
    args:
      - 'ci'

  # Run tests (uncomment when tests are added)
  # - name: 'node'
  #   entrypoint: 'npm'
  #   args:
  #     - 'test'

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/l0182:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/l0182:latest'
      - '.'

  # Push image to Container Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/l0182'
    id: Push

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    args:
      - run
      - deploy
      - l0182
      - '--platform=managed'
      - '--image=gcr.io/$PROJECT_ID/l0182:$COMMIT_SHA'
      - >-
        --labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID,branch=$BRANCH_NAME
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
      - '--port=50182'
      # --update-env-vars, NOT --set-env-vars: set replaces the whole environment, so a
      # MYSTICWONK_API_URL added out of band would be silently deleted by this deploy —
      # putting a configured deployment back onto mock data, which is exactly the failure the
      # mock's warning exists to make visible. update leaves other variables alone.
      - '--update-env-vars=AUTH_URL=$_AUTH_URL,NODE_ENV=production'
      - '--allow-unauthenticated'
      - '--min-instances=$_MIN_INSTANCES'
      # Pinned to one instance because the mock survey backend holds its pool and its
      # participations in memory: a second instance has its own, so rankings and resumption
      # would be intermittently wrong. REMOVE this once MYSTICWONK_API_URL is set and the real
      # service owns the state — siblings run at 20.
      - '--max-instances=1'
      - '--memory=$_MEMORY'
    id: Deploy
    entrypoint: gcloud

images:
  - 'gcr.io/$PROJECT_ID/l0182:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/l0182:latest'

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DEPLOY_REGION: us-central1
  _AUTH_URL: https://auth.graffiticode.org
  _MIN_INSTANCES: '0'
  _MEMORY: '512Mi'

tags:
  - l0182
  - production